version: '3'
services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  jasmin:
    image: jookies/jasmin:latest
    ports:
      - "1401:1401"
      - "2775:2775"
      - "8990:8990"
    depends_on:
      - redis
      - rabbitmq
    restart: always
